              assert d["emulator_sha256"]==digest, "different NeXium Mach-O across native controls"
              console=(path/"nexium-stdout-stderr.log").read_text(errors="replace")
              original=[line.strip() for line in console.splitlines() if line.strip() in snap+hid]
              markers=set(original)
              if mode=="full-no-virtual":
                  assert not markers, "original no-virtual input control emitted synthetic markers"
              if mode=="ctor-virtual":
                  assert "STAGE36_VIRTUAL_ATTACHED_AND_OPENED" in markers
                  assert not any(s in markers for s in hid),\
                      "inert constructor unexpectedly wrote host HID input"
                  assert "STAGE36_VIRTUAL_SNAPSHOT_PRESS_MAPPED" not in markers
              if mode=="full-virtual":
                  assert "STAGE26_HORIZON_CTOR_ENTERED" not in console,\
                      "normal full GUI cannot be Stage26 constructor wrapper"
                  assert "STAGE32_PREINPUT_CREATED_SOME" in console and \
                    "STAGE32_TAKE_SOME" in console
                  assert "STAGE34_INPUT_POLL_ENTRY" in console
              variants[mode]={
                  "outcome":d["outcome"],
                  "exit_signal":d.get("exit_signal"),
                  "alive_at_deadline":d["alive_at_deadline"],
                  "process_owned_visible_window":d.get("window_found"),
                  "actual_whitelisted_source_markers":original,
                  "synthetic_snapshot_press":
                    "STAGE36_VIRTUAL_SNAPSHOT_PRESS_MAPPED" in markers,
                  "synthetic_snapshot_release":
                    "STAGE36_VIRTUAL_SNAPSHOT_RELEASE_MAPPED" in markers,
                  "actual_host_hid_switch_b_press":
                    "STAGE37_HID_BRIDGE_SYNTHETIC_B_PRESS_HOST_STATE" in markers,
                  "actual_host_hid_switch_b_release":
                    "STAGE37_HID_BRIDGE_SYNTHETIC_B_RELEASE_HOST_STATE" in markers,
                  "guest_npad_shared_memory_bound_unverified":
                    "STAGE37_HID_BRIDGE_GUEST_SHMEM_MAPPING_PRESENT_UNVERIFIED" in markers,
                  "guest_npad_shmem_explicitly_unbound":
                    "STAGE37_HID_BRIDGE_NO_GUEST_NPAD_SHMEM" in markers,
              }
          a=variants["full-virtual"]
          reached=(
              a["synthetic_snapshot_press"] and a["synthetic_snapshot_release"]
              and a["actual_host_hid_switch_b_press"]
              and a["actual_host_hid_switch_b_release"]
          )
          result={
              "schema":"nexium-stage37-real-intel-original-host-hid-bridge/v1",
              "result":"THREE_REAL_INTEL_SYNTHETIC_HID_PATHS_CLASSIFIED",
              "same_compiled_intel_macho_sha256":digest,
              "source_bound_synthetic_switch_b_host_hid_round_trip_positive":reached,
              "guest_hid_npad_shared_memory_verified":False,
              "real_hardware_controller_verified":False,
              "nintendo_game_nro_supplied":False,
              "vandal_hearts_gameplay_verified":False,
              "rendered_game_pixels_verified":False,
              "physical_switch_audio_verified":False,
              "raw_console_uploaded":False,
              "variants":variants,
          }
          (root/"stage37-original-host-hid-bridge.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
          echo 'Stage37 confirms only original host HidState input; no guest NPad memory/game evidence.' >> "$GITHUB_STEP_SUMMARY"

      - name: Audit original NPad LIFO buffer press/release from sanitized booleans
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_npad_lifo_trace.py \
            --root stage37-reports \
            --output stage37-reports/stage38-npad-lifo-report.json

      - name: Keep only authentic safe host-HID marker receipts, no game artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-stage38-intel-original-synthetic-npad-lifo
          path: |
            stage37-reports/full-virtual/gui_process_probe.json
            stage37-reports/full-no-virtual/gui_process_probe.json
            stage37-reports/ctor-virtual/gui_process_probe.json
            stage37-reports/stage37-original-host-hid-bridge.json
            stage37-reports/stage38-npad-lifo-report.json
          if-no-files-found: warn


  guest-hid-probe-nro:
    name: Build libnx guest NPad readback probe
    if: github.head_ref == 'work/intel-stage40-guest-npad-readback'
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile minimal guest PadState probe
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          mkdir -p guest-probe-build
          "$DEVKITA64/bin/aarch64-none-elf-gcc" \
            -std=c11 -Wall -Wextra -Werror -O2 -fPIE \
            -ffunction-sections -fdata-sections \
            -I"$DEVKITPRO/libnx/include" \
            -specs="$DEVKITPRO/libnx/switch.specs" \
            -Wl,--gc-sections -pie \
            probes/nexium_guest_hid_probe.c \
            -L"$DEVKITPRO/libnx/lib" -lnx \
            -o guest-probe-build/nexium-guest-hid-probe.elf
          "$DEVKITPRO/tools/bin/nacptool" --create \
            "NeXium Guest HID Probe" "NeXium Intel Research" "0.1.0" \
            guest-probe-build/nexium-guest-hid-probe.nacp
          "$DEVKITPRO/tools/bin/elf2nro" \
            guest-probe-build/nexium-guest-hid-probe.elf \
            guest-probe-build/nexium-guest-hid-probe.nro \
            --nacp=guest-probe-build/nexium-guest-hid-probe.nacp
          python3 - <<'PY'
          from pathlib import Path
          path = Path("guest-probe-build/nexium-guest-hid-probe.nro")
          data = path.read_bytes()
          if len(data) < 0x14 or data[0x10:0x14] != b"NRO0":
              raise SystemExit("STAGE40_GUEST_HID_NRO_INVALID")
          print(f"STAGE40_GUEST_HID_NRO_READY bytes={len(data)}")
          PY
      - name: Upload diagnostic NRO
        uses: actions/upload-artifact@v4
        with:
          name: stage40-guest-hid-probe-nro
          path: guest-probe-build/nexium-guest-hid-probe.nro
          if-no-files-found: error
          retention-days: 30

  stage40-guest-npad-readback:
    name: Stage40 native Intel guest NPad B press/release readback
    if: github.head_ref == 'work/intel-stage40-guest-npad-readback'
    needs: [intel-build, guest-hid-probe-nro]
    runs-on: macos-15-intel
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Download exact native Intel NeXium executable
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage40-binary
      - name: Download compiled guest HID probe NRO
        uses: actions/download-artifact@v4
        with:
          name: stage40-guest-hid-probe-nro
          path: stage40-probe
      - name: Verify native binary and guest probe
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find stage40-binary -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          NRO="stage40-probe/nexium-guest-hid-probe.nro"
          test -n "$BIN"
          test -s "$NRO"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          test "$(uname -m)" = x86_64
          test "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" != 1
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage40-exe"
      - name: Run guest NRO with sustained synthetic B and safe HID diagnostics
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat "$RUNNER_TEMP/stage40-exe")"
          # Stage40 uses a Rustarmic-only build; the GUI otherwise defaults
          # to Dynarmic, which fails before guest CPU execution begins.
          # Set CPU and diagnostics on the one uninterrupted env invocation.
          # Shell comments must not interrupt backslash-continued assignments.
          env NEXIUM_CPU_BACKEND=rustarmic \
            NEXIUM_MACOS_NO_AUDIO=1 \
            NEXIUM_MACOS_MINIMAL_EFRAME=0 \
            NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=0 \
            NEXIUM_MACOS_HORIZON_CTOR_ONLY=0 \
            NEXIUM_MACOS_SKIP_SDL3_INPUT=0 \
            NEXIUM_MACOS_SDL3_PREINIT_BEFORE_WINIT=1 \
            NEXIUM_MACOS_INPUT_POLL_TRACE=1 \
            NEXIUM_MACOS_VIRTUAL_BUTTON_TEST=1 \
            NEXIUM_MACOS_GUEST_HID_PROBE=1 \
            NEXIUM_MACOS_STAGE37_HID_BRIDGE_TRACE=1 \
            NEXIUM_HID_TRACE=1 \
            NEXIUM_DIAG=lite \
            NEXIUM_LOG_LEVEL=debug \
            python3 scripts/nro_smoke_test.py \
              --exe "$BIN" \
              --nro stage40-probe/nexium-guest-hid-probe.nro \
              --output stage40-evidence \
              --seconds 50 \
              --snapshot-ms 5000
      - name: Require guest-visible B press/release and mapped HID report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_guest_hid_runtime.py \
            --report-dir stage40-evidence \
            --output stage40-evidence/stage40-guest-hid-runtime.json
      - name: Upload only sanitized guest HID evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage40-guest-npad-readback-evidence
          path: stage40-evidence/stage40-guest-hid-runtime.json
          if-no-files-found: warn
          retention-days: 30


