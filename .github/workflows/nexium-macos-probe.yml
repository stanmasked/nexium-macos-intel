            NEXIUM_MACOS_GUEST_HID_PROBE=1 \
            NEXIUM_MACOS_GUEST_AB_PROBE=0 \
            NEXIUM_MACOS_GUEST_DPAD_PROBE=0 \
            NEXIUM_MACOS_GUEST_STICK_X_PROBE=1 \
            NEXIUM_MACOS_STAGE37_HID_BRIDGE_TRACE=1 \
            NEXIUM_HID_TRACE=1 \
            NEXIUM_DIAG=lite \
            NEXIUM_LOG_LEVEL=debug \
            python3 scripts/nro_smoke_test.py \
              --exe "$BIN" \
              --nro stage44-probe/nexium-guest-left-stick-x-probe.nro \
              --output stage44-evidence \
              --seconds 80 \
              --snapshot-ms 5000
      - name: Require guest stick X sequence, original InputSnapshot and host B
