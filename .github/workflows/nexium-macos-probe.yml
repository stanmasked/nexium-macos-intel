              console=(root/name/'nexium-stdout-stderr.log').read_text(errors='replace')
              for marker in needed:
                  assert marker in console, name+' did not reach '+marker
              for marker in all_markers.difference(needed):
                  assert marker not in console, name+' reached unexpected '+marker
              records[name]={k:d.get(k) for k in ('outcome','exit_signal',
                             'alive_at_deadline','window_found','window_probe')}
              if name=='constructor-only':
