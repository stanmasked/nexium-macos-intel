          if-no-files-found: error
          retention-days: 30



  stage53-guest-deadzone-threshold-readback:
    name: Stage53 native Intel guest analog deadzone threshold
    if: github.head_ref == 'work/intel-stage53-deadzone-threshold' || github.head_ref == 'work/intel-stage54-controller-proof-manifest'
    needs: [intel-build, stage53-guest-deadzone-threshold-nro]
    runs-on: macos-15-intel
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Download exact native Intel NeXium executable
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage53-binary
      - name: Download compiled guest HID probe NRO
        uses: actions/download-artifact@v4
        with:
          name: stage53-guest-deadzone-threshold-nro
          path: stage53-probe
      - name: Verify native binary and guest probe
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find stage53-binary -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          NRO="stage53-probe/nexium-guest-deadzone-threshold-probe.nro"
          test -n "$BIN"
          test -s "$NRO"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          test "$(uname -m)" = x86_64
          test "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" != 1
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage53-exe"
      - name: Run guest original below/above default analog deadzone
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat "$RUNNER_TEMP/stage53-exe")"
          # Stage53 uses a Rustarmic-only build; the GUI otherwise defaults
          # to Dynarmic, which fails before guest CPU execution begins.
          # Set CPU and diagnostics on the one uninterrupted env invocation.
          # Shell comments must not interrupt backslash-continued assignments.
          env NEXIUM_CPU_BACKEND=rustarmic \
            NEXIUM_MACOS_NO_AUDIO=1 \
            NEXIUM_MACOS_MINIMAL_EFRAME=0 \
            NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=0 \
            NEXIUM_MACOS_HORIZON_CTOR_ONLY=0 \
            NEXIUM_MACOS_SKIP_SDL3_INPUT=0 \
            NEXIUM_MACOS_SDL3_PREINIT_BEFORE_WINIT=1 \
            NEXIUM_MACOS_INPUT_POLL_TRACE=1 \
            NEXIUM_MACOS_VIRTUAL_BUTTON_TEST=1 \
            NEXIUM_MACOS_GUEST_HID_PROBE=1 \
            NEXIUM_MACOS_GUEST_AB_PROBE=0 \
            NEXIUM_MACOS_GUEST_DPAD_PROBE=0 \
            NEXIUM_MACOS_GUEST_STICK_X_PROBE=0 \
            NEXIUM_MACOS_GUEST_STICK_Y_PROBE=0 \
            NEXIUM_MACOS_GUEST_RIGHT_X_PROBE=0 \
            NEXIUM_MACOS_GUEST_RIGHT_Y_PROBE=0 \
            NEXIUM_MACOS_GUEST_DUAL_STICK_PROBE=0 \
            NEXIUM_MACOS_GUEST_DEADZONE_JITTER_PROBE=0 \
            NEXIUM_MACOS_GUEST_DEADZONE_THRESHOLD_PROBE=1 \
            NEXIUM_MACOS_STAGE37_HID_BRIDGE_TRACE=1 \
            NEXIUM_HID_TRACE=1 \
            NEXIUM_DIAG=lite \
            NEXIUM_LOG_LEVEL=debug \
            python3 scripts/nro_smoke_test.py \
              --exe "$BIN" \
              --nro stage53-probe/nexium-guest-deadzone-threshold-probe.nro \
              --output stage53-evidence \
              --seconds 80 \
              --snapshot-ms 5000
      - name: Require below vs above deadzone original host and guest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_guest_deadzone_threshold.py \
            --report-dir stage53-evidence \
            --output stage53-evidence/stage53-guest-deadzone-threshold.json
      - name: Upload only sanitized guest HID evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage53-guest-deadzone-threshold-evidence
          path: stage53-evidence/stage53-guest-deadzone-threshold.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify exact native Intel plus libnx guest proof triplet
        if: github.head_ref == 'work/intel-stage54-controller-proof-manifest'
        shell: bash
        run: |
          set -euo pipefail
          # Build script source pin must match Stage54's fail-closed contract.
          grep -Fx 'REVISION="089562567a0a8760dfdd8420e1f57c35159a9219"' macos_probe.sh
          BIN="$(cat "$RUNNER_TEMP/stage53-exe")"
          python3 scripts/audit_intel_controller_proof_manifest.py \
            --intel-binary "$BIN" \
            --guest-nro stage53-probe/nexium-guest-deadzone-threshold-probe.nro \
            --guest-receipt stage53-evidence/stage53-guest-deadzone-threshold.json \
            --source-sha 089562567a0a8760dfdd8420e1f57c35159a9219 \
            --repository-sha "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --output stage53-evidence/stage54-controller-proof-manifest.json
      - name: Upload only sanitized exact-build proof manifest
        if: always() && github.head_ref == 'work/intel-stage54-controller-proof-manifest'
        uses: actions/upload-artifact@v4
        with:
          name: stage54-exact-intel-controller-proof-manifest
          path: stage53-evidence/stage54-controller-proof-manifest.json
          if-no-files-found: warn
          retention-days: 30





  intel-build:
    # Stage-13 independently checks capture/archive helpers without duplicating
    # the expensive active main-port compiler jobs.
    if: github.head_ref != 'work/intel-stage13-private-window-evidence' && github.head_ref != 'work/intel-stage39-guest-hid-map-audit'
    name: Native Intel build (${{ matrix.backend }}, experimental)
    # Intel compiler-rt preflight itself now reruns all syntax and fixture tests;
    # do not stall macOS builds on GitHub's independent Ubuntu runner queue.
    needs: [mig-intel, compiler-rt-intel]
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # This PR is a narrow macOS UI audio-ablation experiment.
        backend: [rustarmic]
    env:
      NEXIUM_CPU_BACKEND: ${{ matrix.backend }}
      NEXIUM_EXPERIMENT_AUDIO_ABLATION: '1'
      NEXIUM_EXPERIMENT_MINIMAL_EFRAME: '1'
      NEXIUM_EXPERIMENT_FULL_INIT_MINIMAL_APP: '1'
      NEXIUM_EXPERIMENT_HORIZON_CTOR_ONLY: '1'
      NEXIUM_EXPERIMENT_HORIZON_CTOR_PHASE_TRACE: '1'
      NEXIUM_EXPERIMENT_SDL3_INPUT_ABLATION: '1'
      NEXIUM_EXPERIMENT_SDL3_PREWINIT: '1'
      NEXIUM_EXPERIMENT_INPUT_POLL_MARKERS: '1'
      NEXIUM_EXPERIMENT_VIRTUAL_INPUT_SNAPSHOT: '1'
      NEXIUM_EXPERIMENT_STAGE37_HID_BRIDGE: '1'
      NEXIUM_EXPERIMENT_STAGE40_GUEST_HID: ${{ (github.head_ref == 'work/intel-stage40-guest-npad-readback' || github.head_ref == 'work/intel-stage42-guest-ab-chord' || github.head_ref == 'work/intel-stage43-guest-dpad-up-right' || github.head_ref == 'work/intel-stage44-guest-left-stick-x' || github.head_ref == 'work/intel-stage45-guest-left-stick-y' || github.head_ref == 'work/intel-stage46-guest-right-stick-x' || github.head_ref == 'work/intel-stage47-guest-right-stick-y' || github.head_ref == 'work/intel-stage48-dual-stick-combined' || github.head_ref == 'work/intel-stage49-controller-integration' || github.head_ref == 'work/intel-stage50-mixed-dpad-dual-stick') && '1' || '0' }}
      NEXIUM_EXPERIMENT_STAGE42_GUEST_AB: ${{ (github.head_ref == 'work/intel-stage42-guest-ab-chord' || github.head_ref == 'work/intel-stage43-guest-dpad-up-right' || github.head_ref == 'work/intel-stage44-guest-left-stick-x' || github.head_ref == 'work/intel-stage45-guest-left-stick-y' || github.head_ref == 'work/intel-stage46-guest-right-stick-x' || github.head_ref == 'work/intel-stage47-guest-right-stick-y' || github.head_ref == 'work/intel-stage48-dual-stick-combined' || github.head_ref == 'work/intel-stage49-controller-integration' || github.head_ref == 'work/intel-stage50-mixed-dpad-dual-stick') && '1' || '0' }}
      NEXIUM_EXPERIMENT_STAGE43_GUEST_DPAD: ${{ (github.head_ref == 'work/intel-stage43-guest-dpad-up-right' || github.head_ref == 'work/intel-stage44-guest-left-stick-x' || github.head_ref == 'work/intel-stage45-guest-left-stick-y' || github.head_ref == 'work/intel-stage46-guest-right-stick-x' || github.head_ref == 'work/intel-stage47-guest-right-stick-y' || github.head_ref == 'work/intel-stage48-dual-stick-combined' || github.head_ref == 'work/intel-stage49-controller-integration' || github.head_ref == 'work/intel-stage50-mixed-dpad-dual-stick') && '1' || '0' }}
      NEXIUM_EXPERIMENT_STAGE44_GUEST_STICK_X: ${{ (github.head_ref == 'work/intel-stage44-guest-left-stick-x' || github.head_ref == 'work/intel-stage45-guest-left-stick-y' || github.head_ref == 'work/intel-stage46-guest-right-stick-x' || github.head_ref == 'work/intel-stage47-guest-right-stick-y' || github.head_ref == 'work/intel-stage48-dual-stick-combined' || github.head_ref == 'work/intel-stage49-controller-integration' || github.head_ref == 'work/intel-stage50-mixed-dpad-dual-stick') && '1' || '0' }}
      NEXIUM_EXPERIMENT_STAGE45_GUEST_STICK_Y: ${{ (github.head_ref == 'work/intel-stage45-guest-left-stick-y' || github.head_ref == 'work/intel-stage46-guest-right-stick-x' || github.head_ref == 'work/intel-stage47-guest-right-stick-y' || github.head_ref == 'work/intel-stage48-dual-stick-combined' || github.head_ref == 'work/intel-stage49-controller-integration' || github.head_ref == 'work/intel-stage50-mixed-dpad-dual-stick') && '1' || '0' }}
      NEXIUM_EXPERIMENT_STAGE46_GUEST_RIGHT_X: ${{ (github.head_ref == 'work/intel-stage46-guest-right-stick-x' || github.head_ref == 'work/intel-stage47-guest-right-stick-y' || github.head_ref == 'work/intel-stage48-dual-stick-combined' || github.head_ref == 'work/intel-stage49-controller-integration' || github.head_ref == 'work/intel-stage50-mixed-dpad-dual-stick') && '1' || '0' }}
      NEXIUM_EXPERIMENT_STAGE47_GUEST_RIGHT_Y: ${{ (github.head_ref == 'work/intel-stage47-guest-right-stick-y' || github.head_ref == 'work/intel-stage48-dual-stick-combined' || github.head_ref == 'work/intel-stage49-controller-integration' || github.head_ref == 'work/intel-stage50-mixed-dpad-dual-stick') && '1' || '0' }}
      NEXIUM_EXPERIMENT_STAGE48_DUAL_STICK: ${{ (github.head_ref == 'work/intel-stage48-dual-stick-combined' || github.head_ref == 'work/intel-stage49-controller-integration' || github.head_ref == 'work/intel-stage50-mixed-dpad-dual-stick') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify true Intel hardware
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          test "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" != 1
          sw_vers
          xcodebuild -version
      - name: Validate Intel Mach Interface Generator
        if: matrix.backend == 'dynarmic'
        run: bash scripts/mig_probe_intel.sh
      - name: Install build dependencies
        run: brew install cmake ninja pkgconf boost molten-vk vulkan-loader vulkan-tools
      - name: Experimental Intel NeXium build
        id: build
        continue-on-error: true
        env:
          # Explicit profile opt-in, never enabled by default or on main.
          NEXIUM_INTEL_INPUT_PROFILE: ${{ (github.head_ref == 'work/intel-stage51-controller-profile' || github.head_ref == 'work/intel-stage52-controller-deadzone-jitter' || github.head_ref == 'work/intel-stage53-deadzone-threshold' || github.head_ref == 'work/intel-stage54-controller-proof-manifest') && 'controller-diagnostics-v1' || 'off' }}
          NEXIUM_EXPERIMENT_STAGE52_DEADZONE_JITTER: ${{ (github.head_ref == 'work/intel-stage52-controller-deadzone-jitter' || github.head_ref == 'work/intel-stage53-deadzone-threshold' || github.head_ref == 'work/intel-stage54-controller-proof-manifest') && '1' || '0' }}
          NEXIUM_EXPERIMENT_STAGE53_DEADZONE_THRESHOLD: ${{ (github.head_ref == 'work/intel-stage53-deadzone-threshold' || github.head_ref == 'work/intel-stage54-controller-proof-manifest') && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "$NEXIUM_INTEL_INPUT_PROFILE" == "controller-diagnostics-v1" ]]; then
            # The legacy CI job supplies per-stage 0s to all unlisted branches.
            # Unset these legacy selectors and let the *branch-independent*
            # explicit diagnostics profile choose its full source patch chain.
            unset NEXIUM_EXPERIMENT_STAGE40_GUEST_HID
            unset NEXIUM_EXPERIMENT_STAGE42_GUEST_AB
            unset NEXIUM_EXPERIMENT_STAGE43_GUEST_DPAD
            unset NEXIUM_EXPERIMENT_STAGE44_GUEST_STICK_X
            unset NEXIUM_EXPERIMENT_STAGE45_GUEST_STICK_Y
            unset NEXIUM_EXPERIMENT_STAGE46_GUEST_RIGHT_X
            unset NEXIUM_EXPERIMENT_STAGE47_GUEST_RIGHT_Y
            unset NEXIUM_EXPERIMENT_STAGE48_DUAL_STICK
          fi
          bash ./macos_probe.sh
      - name: Retain evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-macos-intel-${{ matrix.backend }}-probe
          path: |
            nexium-macos-intel-work/build.log
            nexium-macos-intel-work/dist
          if-no-files-found: warn
      - name: Summarize native compilation diagnostics
        if: always()
        run: |
          echo "### NeXium Intel — ${{ matrix.backend }}" >> "$GITHUB_STEP_SUMMARY"
          if test -f nexium-macos-intel-work/build.log; then
            echo 'Last compiler failures:' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -F -e 'fatal error:' -e 'error[' -e 'error: failed' -e 'error:' -e 'BUILD_BLOCKED' -e 'DYNARMIC_MIG_BLOCKED' -e 'BOOTSTRAP BLOCKED' \
                nexium-macos-intel-work/build.log | tail -n 18 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No build log was produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report compilation blockers
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::NeXium Intel (${{ matrix.backend }}) not yet buildable; inspect artifact build.log"
          exit 1
