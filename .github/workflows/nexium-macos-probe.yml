        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage44-binary
      - name: Download compiled guest HID probe NRO
        uses: actions/download-artifact@v4
        with:
          name: stage44-guest-left-stick-x-nro
          path: stage44-probe
