          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('stage29-reports')
          names=('ctor-input-enabled','ctor-input-skipped',
                 'full-input-skipped','full-init-minimal')
          result={}
          digest=None
          for name in names:
              p=root/name/'gui_process_probe.json'
              assert p.is_file(), 'missing authentic process receipt: '+name
              row=json.loads(p.read_text())
              assert row['probe']=='no_nro_gui_process_only'
              assert row['nro_verified'] is False and row['gameplay_verified'] is False
              assert row['gui_verified'] is False
              assert row['outcome'] in ('exited_nonzero',
                                      'exited_zero_unverified',
                                      'alive_without_gui_verification')
              if digest is None: digest=row['emulator_sha256']
              assert digest==row['emulator_sha256'],'mixed native binaries'
              console=(root/name/'nexium-stdout-stderr.log').read_text(errors='replace')
              entry='STAGE26_HORIZON_CTOR_ENTERED' in console
              returned='STAGE26_HORIZON_CTOR_RETURNED' in console
              skipped='STAGE29_SDL3_INPUT_SKIPPED' in console
              enabled='STAGE29_SDL3_INPUT_ENABLED' in console
              expect_ctor=name!='full-init-minimal'
              if expect_ctor: assert entry,'ctor branch never entered'
              else:
                  assert not entry and not (skipped or enabled)
                  assert 'STAGE25_HOST_INIT_MINIMAL_APP_ENTERED' in console
              assert not(skipped and enabled),'contradictory SDL3 branch markers'
              if name=='ctor-input-enabled': assert not skipped
              elif expect_ctor: assert not enabled
              result[name]={
                 'outcome':row['outcome'],'exit_signal':row.get('exit_signal'),
                 'alive_at_deadline':row['alive_at_deadline'],
                 'window_found':row.get('window_found'),
                 'ctor_entered':entry,'ctor_returned':returned,
                 'actual_input_skip_branch_reached':skipped,
                 'actual_input_enabled_branch_reached':enabled,
                 'last_stage28_phase_seen':next(
                    (line.strip() for line in reversed(console.splitlines())
                     if 'STAGE28_HORIZON_CTOR_PHASE_' in line),None),
                 'winit_reentrant_panic':
                    'tried to handle event while another event is currently being handled'
                    in console,
              }
          out={'schema':'nexium-stage29-sdl3-input-ctor-ablation/v1',
               'result':'FOUR_ACTUAL_NATIVE_INTEL_PROCESS_RECEIPTS_CLASSIFIED',
               'single_compiled_executable_sha256':digest,'variants':result,
               'guest_game_nro_supplied':False,'speaker_sound_verified':False,
               'frame_pixels_verified':False,'root_cause_proven':False}
          (root/'stage29-input-contrast.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
