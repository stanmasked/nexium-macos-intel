              json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
          echo 'Stage26: original ctor vs original UI process evidence classified, no game.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload four sanitized process receipts, never game/NRO files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-stage26-constructor-first-frame-contrast
          path: |
            stage26-report/full-horizonapp/gui_process_probe.json
            stage26-report/constructor-only/gui_process_probe.json
            stage26-report/full-init-minimal/gui_process_probe.json
