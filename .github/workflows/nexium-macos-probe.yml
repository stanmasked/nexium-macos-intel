  sdl3-subphase-compare:
    name: Stage38 actual Intel SDL3 initialization call sequence
    if: github.head_ref == 'work/intel-stage38-sdl3-init-subphases'
    runs-on: macos-15-intel
    needs: intel-build
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve this exact native Intel Rustarmic build
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage38-binary
      - name: Verify x86_64 and compile own-window observer
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find stage38-binary -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage38-exe"
          xcrun swiftc -framework CoreGraphics \
            -o "$RUNNER_TEMP/stage38-window" scripts/nexium_window_id.swift
      - name: Observe unmodified SDL3 subsystem path with static subphase markers
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/stage38-exe")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
            NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=0 NEXIUM_MACOS_HORIZON_CTOR_ONLY=1 \
            NEXIUM_MACOS_SKIP_SDL3_INPUT=0 NEXIUM_MACOS_SDL3_SUBPHASE_TRACE=1 \
            python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
              --output stage38-report/sdl3-on --seconds 12 \
              --window-helper "$RUNNER_TEMP/stage38-window"
      - name: Observe same constructor with SDL3 disabled negative control
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/stage38-exe")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
            NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=0 NEXIUM_MACOS_HORIZON_CTOR_ONLY=1 \
            NEXIUM_MACOS_SKIP_SDL3_INPUT=1 NEXIUM_MACOS_SDL3_SUBPHASE_TRACE=1 \
            python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
              --output stage38-report/sdl3-off --seconds 12 \
              --window-helper "$RUNNER_TEMP/stage38-window"
      - name: Classify actual subphases without inferring a causal source call
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("stage38-report")
          markers=("00_ENTRY","01_BEFORE_SDL_INIT","02_BEFORE_GAMEPAD_SUBSYSTEM",
                   "03_BEFORE_RUMBLE","04_BEFORE_INPUT_STRUCT")
          records={}
          digests=[]
          for name in ("sdl3-on","sdl3-off"):
              base=root/name
              row=json.loads((base/"gui_process_probe.json").read_text())
              assert row["probe"]=="no_nro_gui_process_only"
              assert row["nro_verified"] is False and row["gameplay_verified"] is False
              assert row["gui_verified"] is False
              digests.append(row["emulator_sha256"])
              log=(base/"nexium-stdout-stderr.log").read_bytes()[:350000].decode("utf-8","replace")
              observed=re.findall(r"^STAGE38_SDL3_INPUT_([A-Z0-9_]+)\s*$",log,re.M)
              assert observed==list(markers[:len(observed)]), "out-of-order/unknown SDL3 checkpoint"
              if name=="sdl3-on":
                  assert re.search(r"^STAGE29_SDL3_INPUT_ENABLED\s*$",log,re.M)
                  assert observed, "authentic SDL3 InputBackend was never entered"
              else:
                  assert re.search(r"^STAGE29_SDL3_INPUT_SKIPPED\s*$",log,re.M)
                  assert not observed, "negative SDL3 bypass unexpectedly called InputBackend"
              records[name]={
                  "process_outcome":row["outcome"],
                  "exit_signal":row.get("exit_signal"),
                  "alive_at_deadline":row["alive_at_deadline"],
                  "own_window_found":row.get("window_found",False),
                  "observed_ordered_input_phases":observed,
                  "last_observed_input_phase":observed[-1] if observed else None,
                  "winit_reentrant_panic":
                     "tried to handle event while another event is currently being handled" in log
              }
          assert len(set(digests))==1,"different Intel executables"
          report={
              "schema":"nexium-stage38-sdl3-input-subphase-intel/v1",
              "single_native_executable_sha256":digests[0],
              "variants":records,
              "absence_of_a_marker_not_proof_source_call_never_executed":True,
              "root_cause_verified":False,
              "nro_supplied":False,
              "gameplay_verified":False,
              "graphics_pixels_verified":False,
              "controllers_verified":False
          }
          (root/"stage38-subphases.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Keep only whitelisted diagnostics, no process logs or screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-stage38-sdl3-subphase-evidence
          path: |
            stage38-report/sdl3-on/gui_process_probe.json
            stage38-report/sdl3-off/gui_process_probe.json
            stage38-report/stage38-subphases.json
          if-no-files-found: warn

  sdl3-cutpoint-compare:
    name: Stage39 seven native Intel SDL3 cutpoint contrasts
    if: github.head_ref == 'work/intel-stage39-sdl3-cutpoint-bisect'
    runs-on: macos-15-intel
    needs: intel-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's exact native Rustarmic Intel Mach-O
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage39-binary
      - name: Validate executable and own-window observer
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find stage39-binary -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage39-bin"
          xcrun swiftc -framework CoreGraphics -o "$RUNNER_TEMP/stage39-window" scripts/nexium_window_id.swift
      - name: Run seven real processes from exactly one binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat "$RUNNER_TEMP/stage39-bin")"
          for mode in no-input before-hints before-init before-gamepad before-rumble before-struct full; do
            skip=0
            stop=none
            case "$mode" in
              no-input) skip=1 ;;
              before-hints) stop=hints ;;
              before-init) stop=init ;;
              before-gamepad) stop=gamepad ;;
              before-rumble) stop=rumble ;;
              before-struct) stop=struct ;;
              full) ;;
              *) exit 2 ;;
            esac
            echo "Stage39 native process: $mode"
            env NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
              NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=0 NEXIUM_MACOS_HORIZON_CTOR_ONLY=1 \
              NEXIUM_MACOS_SKIP_SDL3_INPUT="$skip" \
              NEXIUM_MACOS_SDL3_SUBPHASE_TRACE=1 \
              NEXIUM_MACOS_SDL3_STOP_BEFORE="$stop" \
              python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
                --output "stage39-report/$mode" --seconds 12 \
                --window-helper "$RUNNER_TEMP/stage39-window" || true
          done
      - name: Source-bound audit of seven original process receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_sdl3_cutpoints.py \
            --reports stage39-report \
            --output stage39-report/stage39-cutpoints.json
      - name: Save only sanitized evidence, not runtime logs or screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-stage39-sdl3-cutpoint-receipts
          path: |
            stage39-report/stage39-cutpoints.json
          if-no-files-found: warn

  sdl3-prewarm-compare:
    name: Stage40 Intel SDL3 pre-eframe controller initialization contrasts
    if: github.head_ref == 'work/intel-stage40-sdl3-prewarm-handoff'
    runs-on: macos-15-intel
    needs: intel-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve this exact instrumented Intel executable
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage40-binary
      - name: Verify native x86_64 and prepare window verifier
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find stage40-binary -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage40-bin"
          xcrun swiftc -framework CoreGraphics -o "$RUNNER_TEMP/stage40-window" scripts/nexium_window_id.swift
      - name: Contrast ordinary SDL3, main-thread prewarm and SDL3 bypass
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat "$RUNNER_TEMP/stage40-bin")"
          for mode in normal prewarm skipped; do
            prewarm=0
            skip=0
            case "$mode" in
              normal) ;;
              prewarm) prewarm=1 ;;
              skipped) skip=1 ;;
              *) exit 2 ;;
            esac
            echo "Stage40 original native process mode: $mode"
            env NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
              NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=0 NEXIUM_MACOS_HORIZON_CTOR_ONLY=1 \
              NEXIUM_MACOS_SKIP_SDL3_INPUT="$skip" \
              NEXIUM_MACOS_PREWARM_SDL3_INPUT="$prewarm" \
              NEXIUM_MACOS_SDL3_STOP_BEFORE=none \
              NEXIUM_MACOS_SDL3_SUBPHASE_TRACE=1 \
              python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
                --output "stage40-reports/$mode" --seconds 12 \
                --window-helper "$RUNNER_TEMP/stage40-window" || true
          done
      - name: Require original process markers and keep sanitized output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_sdl3_prewarm.py \
            --reports stage40-reports \
            --output stage40-reports/stage40-prewarm-audit.json
      - name: Upload only whitelisted source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-stage40-sdl3-prewarm-evidence
          path: stage40-reports/stage40-prewarm-audit.json
          if-no-files-found: warn

  intel-build:
    # Stage-13 independently checks capture/archive helpers without duplicating
    # the expensive active main-port compiler jobs.
    if: github.head_ref != 'work/intel-stage13-private-window-evidence' && github.head_ref != 'work/intel-stage37-sdl3-original-replay'
    name: Native Intel build (${{ matrix.backend }}, experimental)
    # Intel compiler-rt preflight itself now reruns all syntax and fixture tests;
    # do not stall macOS builds on GitHub's independent Ubuntu runner queue.
    needs: [mig-intel, compiler-rt-intel]
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # This PR is a narrow macOS UI audio-ablation experiment.
        backend: [rustarmic]
    env:
      NEXIUM_CPU_BACKEND: ${{ matrix.backend }}
      NEXIUM_EXPERIMENT_AUDIO_ABLATION: '1'
      NEXIUM_EXPERIMENT_MINIMAL_EFRAME: '1'
      NEXIUM_EXPERIMENT_FULL_INIT_MINIMAL_APP: '1'
      NEXIUM_EXPERIMENT_HORIZON_CTOR_ONLY: '1'
      NEXIUM_EXPERIMENT_HORIZON_CTOR_PHASE_TRACE: '1'
      NEXIUM_EXPERIMENT_SDL3_INPUT_ABLATION: '1'
      NEXIUM_EXPERIMENT_SDL3_SUBPHASE_TRACE: '1'
      NEXIUM_EXPERIMENT_SDL3_CUTPOINT_BISECT: '1'
      NEXIUM_EXPERIMENT_SDL3_PREWARM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify true Intel hardware
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          test "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" != 1
          sw_vers
          xcodebuild -version
      - name: Validate Intel Mach Interface Generator
        if: matrix.backend == 'dynarmic'
        run: bash scripts/mig_probe_intel.sh
      - name: Install build dependencies
        run: brew install cmake ninja pkgconf boost molten-vk vulkan-loader vulkan-tools
      - name: Experimental Intel NeXium build
        id: build
        continue-on-error: true
        run: bash ./macos_probe.sh
      - name: Retain evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-macos-intel-${{ matrix.backend }}-probe
          path: |
            nexium-macos-intel-work/build.log
            nexium-macos-intel-work/dist
          if-no-files-found: warn
      - name: Summarize native compilation diagnostics
        if: always()
        run: |
          echo "### NeXium Intel — ${{ matrix.backend }}" >> "$GITHUB_STEP_SUMMARY"
          if test -f nexium-macos-intel-work/build.log; then
            echo 'Last compiler failures:' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -F -e 'fatal error:' -e 'error[' -e 'error: failed' -e 'error:' -e 'BUILD_BLOCKED' -e 'DYNARMIC_MIG_BLOCKED' -e 'BOOTSTRAP BLOCKED' \
                nexium-macos-intel-work/build.log | tail -n 18 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No build log was produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report compilation blockers
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::NeXium Intel (${{ matrix.backend }}) not yet buildable; inspect artifact build.log"
          exit 1
