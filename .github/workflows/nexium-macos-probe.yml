            --stage40-positive-receipt stage41-positive/stage40-guest-hid-runtime.json \
            --output stage41-no-virtual/stage41-negative-control.json
      - name: Upload sanitized negative control only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage41-guest-npad-no-virtual-evidence
          path: stage41-no-virtual/stage41-negative-control.json
          if-no-files-found: warn
          retention-days: 30

