    if: github.head_ref == 'work/intel-stage32-sdl3-prewinit-initialization'
    needs: intel-build
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download same freshly compiled Intel NeXium Rustarmic executable
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage32-bundle
      - name: Verify actual x86_64 native Mach-O, prepare scoped window helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          BIN="$(find stage32-bundle -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
