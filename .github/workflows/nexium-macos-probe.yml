              full-no-input)
                preinit=0; skip=1; ctor=0; minimal=0 ;;
              host-minimal)
                preinit=0; skip=1; ctor=0; minimal=1 ;;
            esac
            echo "Stage32 actual process: $mode (no NRO or audio)"
            env NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
              NEXIUM_MACOS_HORIZON_CTOR_ONLY="$ctor" \
              NEXIUM_MACOS_FULL_INIT_MINIMAL_APP="$minimal" \
              NEXIUM_MACOS_SKIP_SDL3_INPUT="$skip" \
              NEXIUM_MACOS_SDL3_PREINIT_BEFORE_WINIT="$preinit" \
              NEXIUM_MACOS_CONSTRUCTOR_PHASE_TRACE=1 \
              python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
                --output "stage32-report/$mode" --seconds 12 \
                --window-helper "$RUNNER_TEMP/stage32-window" || rc=$?
            # Crash inside a real pre-winit SDL3 initializer is a legitimate
            # diagnostic result, not a CI result to relabel as "success".
            unset rc
          done

      - name: Validate five source-bound original process receipts without inferring controller function
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('stage32-report')
          modes=('ctor-normal','ctor-preinitialized','full-preinitialized',
                 'full-no-input','host-minimal')
          digest=None
          receipts={}
          for mode in modes:
              p=root/mode/'gui_process_probe.json'
              assert p.is_file(), 'missing genuine process evidence: '+mode
              d=json.loads(p.read_text())
              assert d['probe']=='no_nro_gui_process_only'
              assert d['nro_verified'] is False and d['gameplay_verified'] is False
              assert d['gui_verified'] is False
              assert d['outcome'] in ('exited_nonzero','exited_zero_unverified',
                                       'alive_without_gui_verification')
              if digest is None: digest=d['emulator_sha256']
              assert digest==d['emulator_sha256'],'not same compiled Mach-O'
              raw=(root/mode/'nexium-stdout-stderr.log').read_text(errors='replace')
              checks=(
                'STAGE32_PREINPUT_BEGIN_BEFORE_WINIT',
                'STAGE32_PREINPUT_CREATED_SOME',
                'STAGE32_PREINPUT_CREATED_NONE',
                'STAGE32_PREINPUT_DONE_BEFORE_WINIT',
                'STAGE32_TAKE_PREINITIALIZED_INPUT',
                'STAGE32_TAKE_SOME',
                'STAGE32_TAKE_NONE',
                'STAGE26_HORIZON_CTOR_ENTERED',
                'STAGE26_HORIZON_CTOR_RETURNED',
                'STAGE29_SDL3_INPUT_ENABLED',
                'STAGE29_SDL3_INPUT_SKIPPED',
                'STAGE25_HOST_INIT_MINIMAL_APP_ENTERED',
              )
              markers={k:k in raw for k in checks}
              if mode in ('ctor-preinitialized','full-preinitialized'):
                  assert markers['STAGE32_PREINPUT_BEGIN_BEFORE_WINIT'],\
                    'preinit mode never entered pre-winit source'
              else:
                  assert not any(markers[k] for k in checks if k.startswith('STAGE32_')),\
                    'preinit markers leaked into control'
              if mode=='host-minimal':
                  assert markers['STAGE25_HOST_INIT_MINIMAL_APP_ENTERED']
                  assert not markers['STAGE26_HORIZON_CTOR_ENTERED']
              if mode=='full-no-input':
                  assert markers['STAGE29_SDL3_INPUT_SKIPPED']
                  assert not markers['STAGE26_HORIZON_CTOR_ENTERED']
              if mode=='ctor-normal':
                  assert markers['STAGE26_HORIZON_CTOR_ENTERED']
                  assert not markers['STAGE32_PREINPUT_BEGIN_BEFORE_WINIT']
              if markers['STAGE32_TAKE_SOME']:
                  assert markers['STAGE32_PREINPUT_CREATED_SOME'],\
                    'claimed actual InputBackend without successful creation'
              assert not (markers['STAGE32_PREINPUT_CREATED_SOME'] and
                          markers['STAGE32_PREINPUT_CREATED_NONE'])
              assert not (markers['STAGE32_TAKE_SOME'] and
                          markers['STAGE32_TAKE_NONE'])
              receipts[mode]={
                 'outcome':d['outcome'],
                 'exit_signal':d.get('exit_signal'),
                 'alive_at_12_second_deadline':d['alive_at_deadline'],
                 'process_owned_visible_window':d.get('window_found'),
                 'static_source_markers':markers,
                 'actual_sdl3_controller_input_reused_before_winit':
                   markers['STAGE32_PREINPUT_CREATED_SOME'] and
                   markers['STAGE32_TAKE_SOME'],
                 'winit_reentrant_event_panic_observed':
                   'tried to handle event while another event is currently being handled'
                   in raw,
              }
          out={'schema':'nexium-stage32-prewinit-sdl3-preserving/v1',
               'result':'FIVE_ACTUAL_INTEL_MAC_GUI_PROCESS_PATHS_CLASSIFIED',
               'same_native_executable_sha256':digest,'variants':receipts,
               'nro_supplied':False,'guest_game_verified':False,
               'controller_button_press_verified':False,
               'frame_pixel_correctness_verified':False,
               'physical_nintendo_switch_sound_verified':False,
               'root_cause_proven':False,
               'original_console_uploaded':False}
          (root/'stage32-original-five-mode-contrast.json').write_text(
             json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          echo 'Stage32: five native Intel traces classified; controller usability still requires input test.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload only five sanitized receipts and original marker decision audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-stage32-sdl3-prewinit-controls
          path: |
            stage32-report/ctor-normal/gui_process_probe.json
            stage32-report/ctor-preinitialized/gui_process_probe.json
            stage32-report/full-preinitialized/gui_process_probe.json
            stage32-report/full-no-input/gui_process_probe.json
            stage32-report/host-minimal/gui_process_probe.json
            stage32-report/stage32-original-five-mode-contrast.json
          if-no-files-found: warn

  input-poll-observation:
    name: Stage34 real Intel SDL3 input event pump proof after pre-winit init
    if: github.head_ref == 'work/intel-stage34-real-input-poll-observation'
    needs: intel-build
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download freshly compiled native Intel Rustarmic NeXium
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage34-intel-bundle
      - name: Validate real x86_64 and prepare process-own-window detector
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          BIN="$(find stage34-intel-bundle -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage34-bin"
          xcrun swiftc -framework CoreGraphics -o "$RUNNER_TEMP/stage34-window" \
            scripts/nexium_window_id.swift

      - name: Launch actual SDL3-preserved original GUI and independent negative controls
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat "$RUNNER_TEMP/stage34-bin")"
          for mode in full-preinitialized ctor-preinitialized full-no-input ctor-normal; do
            case "$mode" in
              full-preinitialized) pre=1; skip=0; ctor=0 ;;
              ctor-preinitialized) pre=1; skip=0; ctor=1 ;;
              full-no-input) pre=0; skip=1; ctor=0 ;;
              ctor-normal) pre=0; skip=0; ctor=1 ;;
            esac
            echo "Stage34 native Intel source-bound process $mode"
            env NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
              NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=0 \
              NEXIUM_MACOS_CONSTRUCTOR_PHASE_TRACE=1 \
              NEXIUM_MACOS_HORIZON_CTOR_ONLY="$ctor" \
              NEXIUM_MACOS_SKIP_SDL3_INPUT="$skip" \
              NEXIUM_MACOS_SDL3_PREINIT_BEFORE_WINIT="$pre" \
              NEXIUM_MACOS_INPUT_POLL_TRACE=1 \
              python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
                --output "stage34-reports/$mode" --seconds 16 \
                --window-helper "$RUNNER_TEMP/stage34-window" || code=$?
            # Original crash, if present, remains a real classified diagnostic.
            unset code
          done

      - name: Audit actual once-only InputBackend polling and branch provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          modes=('full-preinitialized','ctor-preinitialized',
                 'full-no-input','ctor-normal')
          root=Path('stage34-reports')
          source_markers=('STAGE34_INPUT_POLL_ENTRY',
                          'STAGE34_INPUT_POLL_AFTER_EVENT_PUMP',
                          'STAGE34_INPUT_POLL_AFTER_GAMEPAD_UPDATE')
          out={}
          digest=None
          for mode in modes:
              location=root/mode
              f=location/'gui_process_probe.json'
              assert f.is_file(),'missing real process receipt'
              row=json.loads(f.read_text())
              assert row['probe']=='no_nro_gui_process_only'
              assert row['nro_verified'] is False
              assert row['gameplay_verified'] is False
              assert row['gui_verified'] is False
              assert row['outcome'] in ('exited_nonzero',
                                       'exited_zero_unverified',
                                       'alive_without_gui_verification')
              if digest is None: digest=row['emulator_sha256']
              assert digest == row['emulator_sha256'], 'different original Mach-O'
              raw=(location/'nexium-stdout-stderr.log').read_text(errors='replace')
              tokens=[line.strip() for line in raw.splitlines()
                      if line.strip() in source_markers]
              assert len(tokens)==len(set(tokens)), 'one-time marker emitted more than once'
              indices=[source_markers.index(token) for token in tokens]
              assert indices==sorted(indices), 'SDL3 poll phase order mismatch'
              assert not tokens or tokens[0] == source_markers[0], 'no poll entry before later markers'
              created='STAGE32_PREINPUT_CREATED_SOME' in raw
              taken='STAGE32_TAKE_SOME' in raw
              skipped='STAGE29_SDL3_INPUT_SKIPPED' in raw
              entered='STAGE26_HORIZON_CTOR_ENTERED' in raw
              if mode in ('full-preinitialized','ctor-preinitialized'):
                  assert created and taken,'real preinitialized input not retained'
                  assert not skipped
              else:
                  assert not created and not taken,'preinit markers leaked into control'
              if mode=='full-no-input':
                  assert skipped
                  assert not tokens,'SDL3 polling appeared without an InputBackend'
              if mode=='ctor-preinitialized':
                  assert entered
                  assert not tokens,'inert UI must not poll controller input'
              if mode=='ctor-normal':
                  assert entered and not skipped
              if mode=='full-preinitialized':
                  assert not entered,'normal GUI is not the Stage26 wrapper'
              out[mode]={
                  'outcome':row['outcome'],
                  'signal':row.get('exit_signal'),
                  'alive_at_deadline':row['alive_at_deadline'],
                  'process_owned_window_found':row.get('window_found'),
                  'actual_input_object_created_and_transferred':created and taken,
                  'original_poll_source_markers':tokens,
                  'actual_poll_entry_executed':source_markers[0] in tokens,
                  'sdl_event_pump_stage_passed':source_markers[1] in tokens,
                  'sdl_gamepad_update_stage_passed':source_markers[2] in tokens,
                  'hardware_button_press_observed':False,
              }
          result={
             'schema':'nexium-stage34-real-intel-sdl3-poll-observation/v1',
             'result':'FOUR_TRUE_NATIVE_INTEL_SDL3_GUI_PROCESS_PATHS_CLASSIFIED',
             'single_compiled_intel_macho_sha256':digest,
             'variants':out,
             'actual_controller_buttons_verified':False,
             'game_nro_supplied':False,
             'game_pixels_verified':False,
             'speaker_audio_verified':False,
             'root_cause_proven':False,
             'private_console_uploaded':False,
          }
          (root/'stage34-input-poll-evidence.json').write_text(
              json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
          echo 'Stage34: source-bound SDL3 poll call observation, not gamepad button or guest proof.' >> "$GITHUB_STEP_SUMMARY"

      - name: Save original sanitized process statuses and whitelisted poll markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-stage34-intel-original-controller-poll-evidence
          path: |
            stage34-reports/full-preinitialized/gui_process_probe.json
            stage34-reports/ctor-preinitialized/gui_process_probe.json
            stage34-reports/full-no-input/gui_process_probe.json
            stage34-reports/ctor-normal/gui_process_probe.json
            stage34-reports/stage34-input-poll-evidence.json
          if-no-files-found: warn

  virtual-sdl3-snapshot-intel:
    name: Stage36 genuine Intel SDL3 synthetic virtual A press/release to InputSnapshot
    if: github.head_ref == 'work/intel-stage36-virtual-gamepad-snapshot'
    needs: intel-build
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify real Intel and actual compiled NeXium Rustarmic
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage36-build
      - name: Pin x86_64 architecture and CoreGraphics PID window helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          BIN="$(find stage36-build -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage36-bin"
          xcrun swiftc -framework CoreGraphics -o "$RUNNER_TEMP/stage36-window" \
            scripts/nexium_window_id.swift

      - name: Three real Intel original processes, one *synthetic* SDL3 gamepad test
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat "$RUNNER_TEMP/stage36-bin")"
          for mode in full-virtual full-no-virtual ctor-virtual; do
            case "$mode" in
              full-virtual) virt=1; ctor=0; seconds=24 ;;
              full-no-virtual) virt=0; ctor=0; seconds=12 ;;
              ctor-virtual) virt=1; ctor=1; seconds=12 ;;
            esac
            echo "Stage36 authentic native Intel source variant: $mode"
            env NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
              NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=0 \
              NEXIUM_MACOS_HORIZON_CTOR_ONLY="$ctor" \
              NEXIUM_MACOS_SKIP_SDL3_INPUT=0 \
              NEXIUM_MACOS_SDL3_PREINIT_BEFORE_WINIT=1 \
              NEXIUM_MACOS_INPUT_POLL_TRACE=1 \
              NEXIUM_MACOS_VIRTUAL_BUTTON_TEST="$virt" \
              python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
                --output "stage36-reports/$mode" --seconds "$seconds" \
                --window-helper "$RUNNER_TEMP/stage36-window" || rc=$?
            unset rc
          done

      - name: Audit actual SDL3 virtual synthetic press and original InputSnapshot source emissions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          names=('full-virtual','full-no-virtual','ctor-virtual')
          observed={}
          sha=None
          milestones=(
              'STAGE36_VIRTUAL_ATTACHED_AND_OPENED',
              'STAGE36_VIRTUAL_SYNTHETIC_PRESS_SENT',
              'STAGE36_VIRTUAL_SYNTHETIC_RELEASE_SENT',
              'STAGE36_VIRTUAL_SNAPSHOT_CONNECTED',
              'STAGE36_VIRTUAL_SNAPSHOT_PRESS_MAPPED',
              'STAGE36_VIRTUAL_SNAPSHOT_RELEASE_MAPPED',
          )
          for name in names:
              path=Path('stage36-reports')/name
              p=path/'gui_process_probe.json'
              assert p.is_file(), 'missing genuine original macOS process receipt'
              row=json.loads(p.read_text())
              assert row['probe']=='no_nro_gui_process_only'
              assert row['nro_verified'] is False and row['gameplay_verified'] is False
              assert row['gui_verified'] is False
              assert row['outcome'] in ('exited_nonzero','exited_zero_unverified',
                                       'alive_without_gui_verification')
              if sha is None: sha=row['emulator_sha256']
              assert sha==row['emulator_sha256'],'synthetic and controls use different executables'
              console=(path/'nexium-stdout-stderr.log').read_text(errors='replace')
              emitted=[line.strip() for line in console.splitlines()
                       if line.strip() in milestones]
              if name=='full-no-virtual':
                  assert not emitted,'control unexpectedly injected synthetic SDL3 device'
              if name=='ctor-virtual':
                  assert 'STAGE26_HORIZON_CTOR_ENTERED' in console
                  assert not any(k in emitted for k in (
                      'STAGE36_VIRTUAL_SNAPSHOT_CONNECTED',
                      'STAGE36_VIRTUAL_SNAPSHOT_PRESS_MAPPED',
                      'STAGE36_VIRTUAL_SNAPSHOT_RELEASE_MAPPED',
                  )), 'inert ctor mode should not poll virtual gamepad'
              if name=='full-virtual':
                  assert 'STAGE26_HORIZON_CTOR_ENTERED' not in console,\
                       'normal GUI must not use Stage26 ctor wrapper'
                  assert 'STAGE32_PREINPUT_CREATED_SOME' in console and \
                         'STAGE32_TAKE_SOME' in console,\
                       'original pre-winit actual SDL3 object not retained'
                  assert 'STAGE34_INPUT_POLL_ENTRY' in console,\
                       'full GUI never executed original InputBackend poll'
              observed[name]={
                  'process_outcome':row['outcome'],
                  'signal':row.get('exit_signal'),
                  'alive_at_deadline':row['alive_at_deadline'],
                  'process_owned_window_found':row.get('window_found'),
                  'actual_synthetic_source_markers':emitted,
                  'synthetic_attached_and_opened':
                    'STAGE36_VIRTUAL_ATTACHED_AND_OPENED' in emitted,
                  'synthetic_press_mapped_by_original_InputSnapshot':
                    'STAGE36_VIRTUAL_SNAPSHOT_PRESS_MAPPED' in emitted,
                  'synthetic_release_mapped_by_original_InputSnapshot':
                    'STAGE36_VIRTUAL_SNAPSHOT_RELEASE_MAPPED' in emitted,
              }
          src=observed['full-virtual']
          synthetic_positive=(
              src['synthetic_attached_and_opened']
              and 'STAGE36_VIRTUAL_SYNTHETIC_PRESS_SENT' in src['actual_synthetic_source_markers']
              and 'STAGE36_VIRTUAL_SYNTHETIC_RELEASE_SENT' in src['actual_synthetic_source_markers']
              and src['synthetic_press_mapped_by_original_InputSnapshot']
              and src['synthetic_release_mapped_by_original_InputSnapshot']
          )
          out={
              'schema':'nexium-stage36-actual-intel-virtual-sdl3-snapshot/v1',
              'result':'THREE_TRUE_INTEL_PROCESS_PATHS_CLASSIFIED',
              'source_compiled_intel_executable_sha256':sha,
              'virtual_input_round_trip_positive':synthetic_positive,
              'synthetic_device_not_physical_hardware':True,
              'controller_button_on_hardware_verified':False,
              'game_nro_supplied':False,
              'game_frames_verified':False,
              'speaker_sound_verified':False,
              'private_console_uploaded':False,
              'modes':observed,
          }
          root=Path('stage36-reports')
          (root/'stage36-sdl3-synthetic-button-summary.json').write_text(
              json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          echo 'Stage36 is strictly synthetic SDL3 virtual button input, not physical hardware.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload only anonymized real process receipts and synthetic booleans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-stage36-synthetic-virtual-sdl3-snapshot
          path: |
            stage36-reports/full-virtual/gui_process_probe.json
            stage36-reports/full-no-virtual/gui_process_probe.json
            stage36-reports/ctor-virtual/gui_process_probe.json
            stage36-reports/stage36-sdl3-synthetic-button-summary.json
          if-no-files-found: warn

