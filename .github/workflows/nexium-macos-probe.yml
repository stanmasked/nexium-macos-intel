            NEXIUM_MACOS_GUEST_HID_PROBE=1 \
            NEXIUM_MACOS_STAGE37_HID_BRIDGE_TRACE=1 \
            NEXIUM_HID_TRACE=1 \
            NEXIUM_DIAG=lite \
            NEXIUM_LOG_LEVEL=debug \
            python3 scripts/nro_smoke_test.py \
              --exe "$BIN" \
              --nro stage41-probe/nexium-guest-hid-probe.nro \
              --output stage41-no-virtual \
              --seconds 70 \
              --snapshot-ms 5000
      - name: Require real guest no-B completion and no synthetic host/NPad B
        if: always()
