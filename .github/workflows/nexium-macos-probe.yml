name: NeXium Intel macOS experimental probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'macos_probe.sh'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/nexium-macos-probe.yml'

# New revisions supersede older expensive Intel compiler probes.
concurrency:
  group: nexium-intel-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  syntax:
    name: Script safety and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and isolated smoke-test harness
        run: |
          set -euo pipefail
          bash -n macos_probe.sh scripts/mig_probe_intel.sh scripts/compiler_rt_probe_intel.sh scripts/package_intel_app.sh
          python3 -m py_compile scripts/apply_macos_bootstrap.py scripts/prepare_dynarmic_macos.py scripts/nro_smoke_test.py scripts/capture_macos_window.py scripts/no_nro_gui_probe.py scripts/apply_macos_audio_ablation.py scripts/apply_macos_minimal_eframe.py scripts/apply_macos_input_ablation.py scripts/apply_nro_fullfile_offset.py
          python3 scripts/nro_smoke_test.py --help >/dev/null
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify patch anchors on actual pinned NeXium sources
        run: |
          set -euo pipefail
          PIN=089562567a0a8760dfdd8420e1f57c35159a9219
          BASE="$RUNNER_TEMP/nexium-pinned"
          mkdir -p "$BASE/nexium-gui/src" "$BASE/nexium-gpu/src" "$BASE/nexium-loader/src"
          for file in nexium-gui/src/main.rs nexium-gui/src/app.rs nexium-gpu/src/adapter.rs nexium-gpu/src/max_clocks.rs nexium-loader/src/nro.rs; do
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/nexium-emu/nexium/$PIN/$file" \
              --output "$BASE/$file"
            test -s "$BASE/$file"
          done
          python3 scripts/apply_macos_bootstrap.py "$BASE"
          python3 scripts/apply_macos_bootstrap.py "$BASE"
          grep -q 'Backends::METAL' "$BASE/nexium-gui/src/main.rs"
          grep -q 'ENUMERATE_PORTABILITY_KHR' "$BASE/nexium-gpu/src/adapter.rs"
          grep -q 'ENUMERATE_PORTABILITY_KHR' "$BASE/nexium-gpu/src/max_clocks.rs"
          python3 scripts/apply_macos_input_ablation.py "$BASE"
          python3 scripts/apply_macos_input_ablation.py "$BASE"
          grep -q 'STAGE28_SDL_INPUT_SKIPPED' "$BASE/nexium-gui/src/app.rs"
          python3 scripts/apply_nro_fullfile_offset.py "$BASE"
          python3 scripts/apply_nro_fullfile_offset.py "$BASE"
          grep -q 'standard_nro_start' "$BASE/nexium-loader/src/nro.rs"
          grep -q 'NRO declared image size out of bounds' "$BASE/nexium-loader/src/nro.rs"

  mig-intel:
    name: Intel macOS Mach header generation
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Mac MIG without compiling NeXium
        run: bash scripts/mig_probe_intel.sh

  compiler-rt-intel:
    name: Intel Xcode compiler-rt linker probe
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Syntax and isolated smoke-test harness
        run: |
          set -euo pipefail
          bash -n macos_probe.sh scripts/mig_probe_intel.sh scripts/compiler_rt_probe_intel.sh scripts/package_intel_app.sh
          python3 -m py_compile scripts/apply_macos_bootstrap.py scripts/prepare_dynarmic_macos.py scripts/nro_smoke_test.py scripts/capture_macos_window.py scripts/no_nro_gui_probe.py scripts/apply_macos_audio_ablation.py scripts/apply_macos_minimal_eframe.py scripts/apply_macos_input_ablation.py scripts/apply_nro_fullfile_offset.py
          python3 scripts/nro_smoke_test.py --help >/dev/null
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify patch anchors on actual pinned NeXium sources
        run: |
          set -euo pipefail
          PIN=089562567a0a8760dfdd8420e1f57c35159a9219
          BASE="$RUNNER_TEMP/nexium-pinned"
          mkdir -p "$BASE/nexium-gui/src" "$BASE/nexium-gpu/src" "$BASE/nexium-loader/src"
          for file in nexium-gui/src/main.rs nexium-gui/src/app.rs nexium-gpu/src/adapter.rs nexium-gpu/src/max_clocks.rs nexium-loader/src/nro.rs; do
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/nexium-emu/nexium/$PIN/$file" \
              --output "$BASE/$file"
            test -s "$BASE/$file"
          done
          python3 scripts/apply_macos_bootstrap.py "$BASE"
          python3 scripts/apply_macos_bootstrap.py "$BASE"
          grep -q 'Backends::METAL' "$BASE/nexium-gui/src/main.rs"
          grep -q 'ENUMERATE_PORTABILITY_KHR' "$BASE/nexium-gpu/src/adapter.rs"
          grep -q 'ENUMERATE_PORTABILITY_KHR' "$BASE/nexium-gpu/src/max_clocks.rs"
          python3 scripts/apply_macos_input_ablation.py "$BASE"
          python3 scripts/apply_macos_input_ablation.py "$BASE"
          grep -q 'STAGE28_SDL_INPUT_SKIPPED' "$BASE/nexium-gui/src/app.rs"
          python3 scripts/apply_nro_fullfile_offset.py "$BASE"
          python3 scripts/apply_nro_fullfile_offset.py "$BASE"
          grep -q 'standard_nro_start' "$BASE/nexium-loader/src/nro.rs"
          grep -q 'NRO declared image size out of bounds' "$BASE/nexium-loader/src/nro.rs"

      - name: Verify native-only window capture helper type checks
        run: xcrun swiftc -typecheck scripts/nexium_window_id.swift
      - name: Verify SDL3 availability symbol links from Rust
        run: bash scripts/compiler_rt_probe_intel.sh --probe

  appkit-control-intel:
    name: Intel macOS clean AppKit window-session control
    if: github.head_ref == 'work/intel-stage13-private-window-evidence'
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated native GUI session control
        run: |
          set -euo pipefail
          xcrun swiftc -framework AppKit -framework CoreGraphics \
            -o "$RUNNER_TEMP/appkit-control" scripts/appkit_gui_session_control.swift
      - name: Determine whether an ordinary AppKit window is visible
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          exe = Path(os.environ["RUNNER_TEMP"]) / "appkit-control"
          try:
              run = subprocess.run([str(exe)], capture_output=True, text=True, timeout=18)
              signal = next((line for line in run.stdout.splitlines()
                             if line.startswith("APPKIT_CONTROL_SESSION:")), None)
              if signal is not None:
                  print(signal[:160])
              print("APPKIT_CONTROL_RESULT: " + (
                  "visible_window_confirmed" if run.returncode == 0 and signal else
                  "no_visible_window" if run.returncode == 4 else
                  f"control_failed_or_headless_{run.returncode}"))
          except subprocess.TimeoutExpired:
              print("APPKIT_CONTROL_RESULT: control_timed_out_or_headless")
          print("A negative AppKit result limits hosted-CI graphical inference; "
                "it does not demonstrate that NeXium fails on an interactive Intel Mac.")
          PY

  no-nro-startup:
    name: Intel Rustarmic GUI process launch without game
    if: github.head_ref == 'work/intel-stage13-private-window-evidence'
    runs-on: macos-15-intel
    needs: [compiler-rt-intel, mig-intel]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve already-built pinned Intel Rustarmic executable
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          repository: ${{ github.repository }}
          run-id: 39493834124
          github-token: ${{ github.token }}
          path: downloaded
      - name: Validate pinned NeXium app architecture and restore ZIP permissions
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find downloaded -type f -path '*/Contents/MacOS/nexium' | wc -l | tr -d '[:space:]')"
          test "$COUNT" -eq 1
          BIN="$(find downloaded -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/nexium-exe-path"
          APP="${BIN%/Contents/MacOS/nexium}"
          LICENSE="$(find downloaded -type f -name 'NeXium-LICENSE.txt' -print -quit)"
          test -n "$LICENSE"
          bash scripts/package_intel_app.sh "$APP" "$LICENSE"
          xcrun swiftc -framework CoreGraphics -o "$RUNNER_TEMP/nexium-window-id" scripts/nexium_window_id.swift
          test -x "$RUNNER_TEMP/nexium-window-id"
          echo "x86_64 NeXium app, scoped window inspector and portable archive verified"
      - name: Repeat real Intel GUI-process startup twice without any NRO
        id: launch
        continue-on-error: true
        shell: bash
        run: |
          # GitHub's bash shell starts with -e; disable it so a first-run
          # crash still allows the independent second start and its report.
          set +e
          set -uo pipefail
          BIN="$(cat "$RUNNER_TEMP/nexium-exe-path")"
          python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
            --output gui-probe-report/attempt-1 --seconds 12 \
            --window-helper "$RUNNER_TEMP/nexium-window-id"
          first=$?
          python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
            --output gui-probe-report/attempt-2 --seconds 12 \
            --window-helper "$RUNNER_TEMP/nexium-window-id"
          second=$?
          echo "First process result: $first; second process result: $second"
          test "$first" -eq 0 && test "$second" -eq 0
      - name: Upload private-free startup evidence and portable bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-rustarmic-no-nro-startup
          path: |
            gui-probe-report/attempt-1/gui_process_probe.json
            gui-probe-report/attempt-1/nexium-stdout-stderr.log
            gui-probe-report/attempt-2/gui_process_probe.json
            gui-probe-report/attempt-2/nexium-stdout-stderr.log
            downloaded/**/*.tar.gz
            downloaded/**/*.tar.gz.sha256
          if-no-files-found: warn
      - name: Fail if the GUI process could not start
        if: steps.launch.outcome == 'failure'
        run: |
          echo '::error::NeXium Intel exited nonzero before no-NRO observation; review attached process log.'
          exit 1

  audio-ablation-compare:
    name: Intel Rustarmic A-B startup comparison — audio enabled versus disabled
    if: github.head_ref == 'work/intel-stage21-audio-ablation'
    runs-on: macos-15-intel
    needs: intel-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download rebuilt Intel binary with guarded audio experiment
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: audio-experiment-bundle
      - name: Verify rebuilt executable architecture
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find audio-experiment-bundle -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/audio-ablation-exe"
      - name: Run original audio-enabled startup control
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/audio-ablation-exe")"
          NEXIUM_MACOS_NO_AUDIO=0 python3 scripts/no_nro_gui_probe.py \
            --exe "$BIN" --output audio-ablation-report/audio-on --seconds 12
      - name: Run audio-disabled startup variant without NRO
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/audio-ablation-exe")"
          NEXIUM_MACOS_NO_AUDIO=1 python3 scripts/no_nro_gui_probe.py \
            --exe "$BIN" --output audio-ablation-report/audio-off --seconds 12
      - name: Summarize both actual Intel startup outcomes
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for label in ('audio-on', 'audio-off'):
              p = Path('audio-ablation-report') / label / 'gui_process_probe.json'
              if not p.is_file():
                  print(label + ': report unavailable')
                  continue
              data = json.loads(p.read_text())
              print(label + ': ' + str({key: data.get(key) for key in
                  ('outcome', 'exit_signal', 'alive_at_deadline', 'cleanup_signal_mode')}))
          print("Any GUI/rendering or NRO success remains unverified.")
          PY
      - name: Upload both startup reports (no private games)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-gui-audio-ablation
          path: audio-ablation-report
          if-no-files-found: warn

  minimal-eframe-compare:
    name: Stage22 native Intel minimal eframe versus normal startup, same Mach-O
    if: github.head_ref == 'work/intel-stage22-minimal-eframe-isolation'
    needs: intel-build
    runs-on: macos-15-intel
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Download one native Intel Mach-O binary built with both opt-in probes
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage22-bundle
      - name: Confirm the single x86_64 executable
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find stage22-bundle -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage22-exe"
      - name: Baseline full NeXium startup with host audio disabled and no NRO
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/stage22-exe")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
            python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
              --output stage22-report/full-without-audio --seconds 12
      - name: Opt-in minimal eframe Wgpu startup on identical Mach-O and no NRO
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/stage22-exe")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=1 \
            python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
              --output stage22-report/minimal-eframe --seconds 12
      - name: Require both genuine process reports and successful minimal-branch entry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('stage22-report')
          def read(name):
              p=root/name/'gui_process_probe.json'
              assert p.is_file(), 'missing measured Intel process report: '+name
              d=json.loads(p.read_text())
              assert d['probe']=='no_nro_gui_process_only'
              assert not d['nro_verified'] and not d['gameplay_verified']
              assert d['gui_verified'] is False
              return d
          normal=read('full-without-audio')
          minimal=read('minimal-eframe')
          assert normal['emulator_sha256']==minimal['emulator_sha256']
          console=(root/'minimal-eframe'/'nexium-stdout-stderr.log').read_text(errors='replace')
          assert 'STAGE22_MINIMAL_EFRAME_ENTERED' in console, 'minimal branch not reached'
          summary={'schema':'nexium-intel-stage22-minimal-eframe-isolation/v1',
                   'result':'BOTH_REAL_INTEL_PROCESS_VARIANTS_OBSERVED',
                   'same_compiled_binary_sha256':normal['emulator_sha256'],
                   'normal_audio_disabled':{'outcome':normal['outcome'],
                       'exit_signal':normal.get('exit_signal'),
                       'alive_at_deadline':normal['alive_at_deadline']},
                   'minimal_eframe':{'outcome':minimal['outcome'],
                       'exit_signal':minimal.get('exit_signal'),
                       'alive_at_deadline':minimal['alive_at_deadline']},
                   'minimal_branch_execution_proven':True,
                   'nro_executed':False,'window_rendering_proven':False,
                   'real_switch_sound_proven':False}
          (root/'stage22-minimal-eframe-comparison.json').write_text(
              json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
          echo "Stage22: genuine Intel process A/B report saved; neither variant includes an NRO." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish sanitized process receipts only; no ROM or private keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-stage22-minimal-eframe-control
          path: |
            stage22-report/full-without-audio/gui_process_probe.json
            stage22-report/minimal-eframe/gui_process_probe.json
            stage22-report/stage22-minimal-eframe-comparison.json
          if-no-files-found: warn

  sdl-input-compare:
    name: Stage28 native Intel full SDL3 input on/off against minimal eframe
    if: github.head_ref == 'work/intel-stage28-sdl3-input-isolation'
    needs: intel-build
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download single native Intel experimental binary
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage28-bundle
      - name: Check native Intel executable and compile private-window helper
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find stage28-bundle -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage28-exe"
          xcrun swiftc -framework CoreGraphics -o "$RUNNER_TEMP/stage28-window" scripts/nexium_window_id.swift
      - name: Baseline full app with gamepad SDL3 and host audio off (no NRO)
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/stage28-exe")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
            NEXIUM_MACOS_SKIP_SDL_INPUT=0 python3 scripts/no_nro_gui_probe.py \
              --exe "$BIN" --output stage28-report/sdl-enabled --seconds 12 \
              --window-helper "$RUNNER_TEMP/stage28-window"
      - name: Identical full app with SDL3 InputBackend omitted, host audio off
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/stage28-exe")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
            NEXIUM_MACOS_SKIP_SDL_INPUT=1 python3 scripts/no_nro_gui_probe.py \
              --exe "$BIN" --output stage28-report/sdl-disabled --seconds 12 \
              --window-helper "$RUNNER_TEMP/stage28-window"
      - name: Minimal eframe-only native macOS control from same Mach-O
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/stage28-exe")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=1 \
            NEXIUM_MACOS_SKIP_SDL_INPUT=0 python3 scripts/no_nro_gui_probe.py \
              --exe "$BIN" --output stage28-report/minimal --seconds 12 \
              --window-helper "$RUNNER_TEMP/stage28-window"
      - name: Verify true identical executable and matching branch markers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('stage28-report')
          targets={
              'sdl-enabled':'STAGE28_SDL_INPUT_INITIALIZING',
              'sdl-disabled':'STAGE28_SDL_INPUT_SKIPPED',
              'minimal':'STAGE22_MINIMAL_EFRAME_ENTERED'
          }
          result={'schema':'nexium-intel-stage28-sdl-input-isolation/v1',
              'comparison':'THREE_ACTUAL_NATIVE_INTEL_PROCESS_PATHS_CLASSIFIED',
              'variants':{},'nro_executed':False,'gameplay_verified':False,
              'pixel_rendering_verified':False,'audio_verified':False}
          hashes=[]
          for name,marker in targets.items():
              p=root/name/'gui_process_probe.json'
              assert p.is_file(), 'missing genuine process receipt: '+name
              row=json.loads(p.read_text())
              assert row['probe']=='no_nro_gui_process_only'
              assert not row['gui_verified'] and not row['nro_verified'] and not row['gameplay_verified']
              console=(root/name/'nexium-stdout-stderr.log').read_text(errors='replace')
              assert marker in console, f'{name}: intended branch was never entered'
              hashes.append(row['emulator_sha256'])
              result['variants'][name]={
                  'outcome':row['outcome'],'exit_signal':row.get('exit_signal'),
                  'alive_at_deadline':row['alive_at_deadline'],
                  'window_found':row.get('window_found',False),
                  'panic_reason_excerpt':row.get('internal_log_signals',{}).get('panic_reason_excerpt',[])
              }
          assert len(set(hashes)) == 1, 'different executable hashes invalidate A/B'
          result['same_executable_sha256']=hashes[0]
          (root/'sdl-input-comparison.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Upload bounded diagnostic receipts, never private game assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-stage28-sdl-input-comparison
          path: |
            stage28-report/sdl-enabled/gui_process_probe.json
            stage28-report/sdl-disabled/gui_process_probe.json
            stage28-report/minimal/gui_process_probe.json
            stage28-report/sdl-input-comparison.json
          if-no-files-found: warn

  nro-fullfile-boot:
    name: Stage33 genuine Intel guest boot after strict full-file NRO loader fix
    if: github.head_ref == 'work/intel-stage33-nro-fullfile-layout'
    needs: intel-build
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download just-built native Intel Rustarmic with loader correction
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: corrected-rustarmic
      - name: Download exact previously verified devkitPro public NRO
        uses: actions/download-artifact@v4
        with:
          name: nexium-clean-homebrew-nro
          repository: ${{ github.repository }}
          run-id: 39508041890
          github-token: ${{ github.token }}
          path: public-nro
      - name: Validate x86_64 plus public NRO checksum and size
        run: |
          set -euo pipefail
          BIN="$(find corrected-rustarmic -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/loader-fixed-exe"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("public-nro")
          nro=(root/"nexium_clean_smoke.nro").read_bytes()
          receipt=json.loads((root/"nro_build_receipt.json").read_text())
          assert len(nro)>=0x80 and nro[0x10:0x14]==b"NRO0"
          assert hashlib.sha256(nro).hexdigest()==receipt["sha256"]
          assert receipt["sha256"]=="2a1faf864eac55b033b2fcf8f385f2246a897a88b0b2d2f535dc0439e4dbf9d3"
          print("STAGE33_PUBLIC_NRO_INTEGRITY_VERIFIED")
          PY
      - name: Real original full GUI no-NRO process control, input startup bypassed
        continue-on-error: true
        run: |
          BIN="$(cat "$RUNNER_TEMP/loader-fixed-exe")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_SKIP_SDL_INPUT=1 \
            NEXIUM_MACOS_MINIMAL_EFRAME=0 python3 scripts/no_nro_gui_probe.py \
              --exe "$BIN" --output stage33-report/baseline --seconds 12
      - name: Actual clean NRO boot into patched guest loader and CPU
        id: guest
        continue-on-error: true
        run: |
          BIN="$(cat "$RUNNER_TEMP/loader-fixed-exe")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_SKIP_SDL_INPUT=1 \
            NEXIUM_MACOS_MINIMAL_EFRAME=0 python3 scripts/nro_smoke_test.py \
              --exe "$BIN" --nro public-nro/nexium_clean_smoke.nro \
              --output stage33-report/guest --seconds 24 --snapshot-ms 1500
      - name: Classify genuine BootContext/CPU/presentation stage without false gameplay
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, re
          from pathlib import Path
          root=Path('stage33-report')
          baseline=json.loads((root/'baseline/gui_process_probe.json').read_text())
          guest=json.loads((root/'guest/smoke_result.json').read_text())
          assert baseline['emulator_sha256']==guest['emulator_sha256'], 'not the same native Intel Mach-O'
          assert not baseline['nro_verified'] and not guest['gameplay_verified']
          files=[root/'guest/nexium-console.log',
                 *sorted((root/'guest/data-root/logs').glob('*.log'))[:12]]
          content='\n'.join(
              p.read_bytes()[:300000].decode('utf-8',errors='replace')
              for p in files if p.is_file() and not p.is_symlink()
          )
          errors=[]
          for line in content.splitlines():
              if 'Boot failed:' not in line: continue
              value=line.partition('Boot failed:')[2].strip()
              value=re.sub(r'/(?:Users|private|tmp|var|Volumes|home)/[^\s,;)]*',
                           '<local-path>',value,flags=re.IGNORECASE)
              errors.append(value[:220])
          report={
            'schema':'nexium-intel-stage33-strict-nro-offset-fix/v1',
            'same_executable_sha256':guest['emulator_sha256'],
            'nro_sha256':guest['nro_sha256'],
            'gui_process_baseline_alive':baseline['alive_at_deadline'],
            'guest_process_status':guest['status'],
            'loader_ui_acceptance': 'Auto-loaded NRO:' in content,
            'guest_boot_thread_entered':'Booting NRO:' in content,
            'guest_boot_context_ready':'Boot context ready' in content,
            'boot_failure_messages_redacted':errors[:3],
            'guest_cpu_started_marker':'cpu memory null policy:' in content,
            'vulkan_renderer_created_marker':'nexium-nvdrv: Vulkan Renderer initialized' in content,
            'snapshot_count':len(guest['snapshots']),
            'unique_snapshot_hashes':guest['unique_frame_hashes'],
            'actual_guest_instructions_verified':False,
            'gameplay_verified':False,
            'sound_or_controller_tested':False,
            'correct_frame_pixels_verified':False
          }
          (root/'stage33-boot-classification.json').write_text(
              json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Upload JSON metadata, never raw NRO, private logs or images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-stage33-fullfile-nro-boot
          path: |
            stage33-report/stage33-boot-classification.json
            stage33-report/baseline/gui_process_probe.json
            stage33-report/guest/smoke_result.json
          if-no-files-found: warn

  intel-build:
    # Stage-13 independently checks capture/archive helpers without duplicating
    # the expensive active main-port compiler jobs.
    if: github.head_ref != 'work/intel-stage13-private-window-evidence'
    name: Native Intel build (${{ matrix.backend }}, experimental)
    # Intel compiler-rt preflight itself now reruns all syntax and fixture tests;
    # do not stall macOS builds on GitHub's independent Ubuntu runner queue.
    needs: [mig-intel, compiler-rt-intel]
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # This PR is a narrow macOS UI audio-ablation experiment.
        backend: [rustarmic]
    env:
      NEXIUM_CPU_BACKEND: ${{ matrix.backend }}
      NEXIUM_EXPERIMENT_AUDIO_ABLATION: '1'
      NEXIUM_EXPERIMENT_MINIMAL_EFRAME: '1'
      NEXIUM_EXPERIMENT_SDL_INPUT_ABLATION: '1'
      NEXIUM_EXPERIMENT_NRO_FULLFILE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify true Intel hardware
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          test "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" != 1
          sw_vers
          xcodebuild -version
      - name: Validate Intel Mach Interface Generator
        if: matrix.backend == 'dynarmic'
        run: bash scripts/mig_probe_intel.sh
      - name: Install build dependencies
        run: brew install cmake ninja pkgconf boost molten-vk vulkan-loader vulkan-tools
      - name: Experimental Intel NeXium build
        id: build
        continue-on-error: true
        run: bash ./macos_probe.sh
      - name: Retain evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-macos-intel-${{ matrix.backend }}-probe
          path: |
            nexium-macos-intel-work/build.log
            nexium-macos-intel-work/dist
          if-no-files-found: warn
      - name: Summarize native compilation diagnostics
        if: always()
        run: |
          echo "### NeXium Intel — ${{ matrix.backend }}" >> "$GITHUB_STEP_SUMMARY"
          if test -f nexium-macos-intel-work/build.log; then
            echo 'Last compiler failures:' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -F -e 'fatal error:' -e 'error[' -e 'error: failed' -e 'error:' -e 'BUILD_BLOCKED' -e 'DYNARMIC_MIG_BLOCKED' -e 'BOOTSTRAP BLOCKED' \
                nexium-macos-intel-work/build.log | tail -n 18 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No build log was produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report compilation blockers
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::NeXium Intel (${{ matrix.backend }}) not yet buildable; inspect artifact build.log"
          exit 1
