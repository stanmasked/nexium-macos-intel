        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find stage44-binary -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          NRO="stage44-probe/nexium-guest-left-stick-x-probe.nro"
          test -n "$BIN"
          test -s "$NRO"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          test "$(uname -m)" = x86_64
          test "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" != 1
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage44-exe"
      - name: Run original libnx left X through real SDL3 and InputSnapshot
        shell: bash
        run: |
          set -euo pipefail
