  ctor-phase-audit:
    name: Stage28 native Intel HorizonApp ctor subphase trace, same Mach-O
    if: github.head_ref == 'work/intel-stage28-horizonapp-constructor-phases'
    needs: intel-build
    runs-on: macos-15-intel
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: Download freshly built native NeXium Rustarmic binary
        uses: actions/download-artifact@v4
        with:
          name: nexium-macos-intel-rustarmic-probe
          path: stage28-bundle
      - name: Prove x86_64 provenance, compile scoped window detector
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          BIN="$(find stage28-bundle -type f -path '*/Contents/MacOS/nexium' -print -quit)"
          test -n "$BIN"
          test "$(xcrun lipo -archs "$BIN")" = x86_64
          chmod 755 "$BIN"
          printf '%s\n' "$BIN" > "$RUNNER_TEMP/stage28-bin"
          xcrun swiftc -framework CoreGraphics -o "$RUNNER_TEMP/stage28-window" \
            scripts/nexium_window_id.swift
      - name: Original full HorizonApp constructor and UI, trace enabled
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/stage28-bin")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
            NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=0 NEXIUM_MACOS_HORIZON_CTOR_ONLY=0 \
            NEXIUM_MACOS_CONSTRUCTOR_PHASE_TRACE=1 \
            python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
              --output stage28-report/full-horizonapp --seconds 12 \
              --window-helper "$RUNNER_TEMP/stage28-window"
      - name: Original real HorizonApp constructor under minimal UI wrapper
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/stage28-bin")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
            NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=0 NEXIUM_MACOS_HORIZON_CTOR_ONLY=1 \
            NEXIUM_MACOS_CONSTRUCTOR_PHASE_TRACE=1 \
            python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
              --output stage28-report/constructor-only --seconds 12 \
              --window-helper "$RUNNER_TEMP/stage28-window"
      - name: Normal host init with no HorizonApp constructor (negative control)
        continue-on-error: true
        shell: bash
        run: |
          BIN="$(cat "$RUNNER_TEMP/stage28-bin")"
          NEXIUM_MACOS_NO_AUDIO=1 NEXIUM_MACOS_MINIMAL_EFRAME=0 \
            NEXIUM_MACOS_FULL_INIT_MINIMAL_APP=1 NEXIUM_MACOS_HORIZON_CTOR_ONLY=0 \
            NEXIUM_MACOS_CONSTRUCTOR_PHASE_TRACE=1 \
            python3 scripts/no_nro_gui_probe.py --exe "$BIN" \
              --output stage28-report/full-init-minimal --seconds 12 \
              --window-helper "$RUNNER_TEMP/stage28-window"
      - name: Audit original process receipts and present only genuine marker prefix
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('stage28-report')
          stages=('00_BEFORE_THEME','01_BEFORE_UI_AUDIO','02_AFTER_UI_AUDIO',
                  '03_BEFORE_INPUT','04_AFTER_INPUT','05_BEFORE_NEXTENDO',
                  '06_AFTER_NEXTENDO','07_AFTER_STRUCT','08_AFTER_PROFILE',
                  '09_AFTER_SFX','10_BEFORE_RESCAN','11_AFTER_RESCAN',
                  '12_BEFORE_RETURN')
          prefix='STAGE28_HORIZON_CTOR_PHASE_'
          names=('full-horizonapp','constructor-only','full-init-minimal')
          seen={}
          digest=None
          for name in names:
              p=root/name/'gui_process_probe.json'
              assert p.is_file(), 'missing real original process receipt: '+name
              d=json.loads(p.read_text())
              assert d['probe']=='no_nro_gui_process_only'
              assert d['nro_verified'] is False and d['gameplay_verified'] is False
              assert d['gui_verified'] is False
              assert d['outcome'] in ('exited_nonzero','exited_zero_unverified','alive_without_gui_verification')
              if digest is None: digest=d['emulator_sha256']
              assert digest==d['emulator_sha256'],'different executable used'
              console=(root/name/'nexium-stdout-stderr.log').read_text(errors='replace')
              found=[s for s in stages if prefix+s in console]
              if found:
                  assert found==list(stages[:len(found)]), 'phase trace skipped a checkpoint'
              entered='STAGE26_HORIZON_CTOR_ENTERED' in console
              returned='STAGE26_HORIZON_CTOR_RETURNED' in console
              if name=='constructor-only':
                  assert entered,'constructor-only path did not enter original HorizonApp'
                  assert not returned or len(found)==len(stages),'returned before checkpoints'
              else:
                  assert not entered and not returned,'unexpected constructor-only marker'
              if name=='full-init-minimal':
                  assert 'STAGE25_HOST_INIT_MINIMAL_APP_ENTERED' in console
                  assert not found,'constructor ran in negative control'
              assert ('STAGE25_HOST_INIT_MINIMAL_APP_ENTERED' in console)==(name=='full-init-minimal')
              seen[name]={
                  'outcome':d['outcome'],'exit_signal':d.get('exit_signal'),
                  'alive_at_deadline':d['alive_at_deadline'],
                  'window_found':d.get('window_found'),
                  'observed_phase_count':len(found),
                  'last_confirmed_phase':found[-1] if found else None,
                  'constructor_entered':entered,
                  'constructor_returned':returned,
                  'winit_reentrant_panic_observed':
                      'tried to handle event while another event is currently being handled'
                      in console,
              }
          summary={'schema':'nexium-stage28-constructor-phase-original-intel/v1',
                   'result':'THREE_REAL_INTEL_CONSTRUCTOR_PHASE_PROCESSES_CLASSIFIED',
                   'single_compiled_binary_sha256':digest,
                   'variants':seen,'nro_or_game_executed':False,
                   'rendered_pixels_verified':False,'speaker_sound_verified':False,
                   'diagnostic_only_not_a_causal_fix':True}
          (root/'stage28-phase-audit.json').write_text(
              json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
          echo 'Stage28: whitelisted native constructor phase evidence; no NRO, hardware or game.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload original sanitized process metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-intel-stage28-horizon-ctor-phases
          path: |
            stage28-report/full-horizonapp/gui_process_probe.json
            stage28-report/constructor-only/gui_process_probe.json
            stage28-report/full-init-minimal/gui_process_probe.json
            stage28-report/stage28-phase-audit.json
          if-no-files-found: warn

