          xcrun swiftc -framework CoreGraphics -o "$RUNNER_TEMP/stage32-window" \
            scripts/nexium_window_id.swift

      - name: Record genuine control, preinitialized input, and bypassed GUI processes
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat "$RUNNER_TEMP/stage32-bin")"
          for mode in ctor-normal ctor-preinitialized full-preinitialized full-no-input host-minimal; do
            case "$mode" in
              ctor-normal)
                preinit=0; skip=0; ctor=1; minimal=0 ;;
              ctor-preinitialized)
